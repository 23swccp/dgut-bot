name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      PYINSTALLER_VERSION: "6.22.2"
      VELOPACK_VERSION: "1.2.0"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET for Velopack
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "pyinstaller==${env:PYINSTALLER_VERSION}"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Tag must match version.py
        shell: pwsh
        run: |
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($tag -ne $version) {
            Write-Error "tag ${{ github.ref_name }} 与 version.py 的版本 $version 不一致；停止发布"
            exit 1
          }

      - name: Build onedir release
        run: python -m PyInstaller packaging/dgut-bot.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test packaged app
        shell: pwsh
        env:
          YXY_SMOKE_DATA_DIR: ${{ runner.temp }}\dgut-bot-smoke-data
        run: |
          python scripts/smoke_test.py "dist/dgut-bot"

      - name: Package and publish with Velopack
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          dotnet tool install --global vpk --version $env:VELOPACK_VERSION
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN
          if ($LASTEXITCODE -ne 0) { Write-Host "没有可用的历史 Velopack 包，将仅生成完整更新包。" }
          vpk pack --packId DgutBot --packVersion $version --packDir dist/dgut-bot --mainExe dgut-bot.exe --packTitle "莞工小皮卡" --packAuthors "23swccp" --icon assets/dgut-bot.ico --runtime win-x64 --noPortable --outputDir Releases
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN --publish --releaseName "v$version" --tag "${{ github.ref_name }}"
          $release = gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | ConvertFrom-Json
          $setup = $release.assets | Where-Object { $_.name -eq "DgutBot-win-Setup.exe" }
          if ($null -eq $setup) { throw "未找到 Velopack Setup.exe，无法添加用户下载提示" }
          gh api --method PATCH "repos/${{ github.repository }}/releases/assets/$($setup.id)" -f "name=DgutBot-win-Setup-Qing-Zhi-Xia-Zai-Zhe-Ge.exe"
          @"
          ## 下载说明

          普通用户请只下载 **DgutBot-win-Setup-Qing-Zhi-Xia-Zai-Zhe-Ge.exe**。

          其余文件由应用内自动更新使用，请勿手动下载。

          如果 GitHub 页面或文件下载失败，可前往 [Gitee 备用下载](https://gitee.com/swccq23/dgut-bot/releases/tag/${{ github.ref_name }}) 获取同一安装器。

          应用内更新源仍是 GitHub；应用内更新失败时，请开启支持 GitHub 的网络加速器后重试。
          "@ | Set-Content -LiteralPath release-download-note.md -Encoding utf8
          gh release edit "${{ github.ref_name }}" --notes-file release-download-note.md

      - name: Publish installer to Gitee mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: swccq23
          GITEE_REPO: dgut-bot
          GITEE_TAG: ${{ github.ref_name }}
          GITEE_TARGET_COMMITISH: main
          GITEE_ASSET: Releases/DgutBot-win-Setup.exe
          GITEE_ASSET_NAME: DgutBot-win-Setup-Qing-Zhi-Xia-Zai-Zhe-Ge.exe
        run: python scripts/publish_gitee_release.py
