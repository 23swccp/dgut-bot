name: Course browser regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'backend/tools/**'
      - 'backend/quiz_simulator/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/course-lab.yml'

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Offline regression
        run: python -m pytest -q
      - name: Existing dialog and PPT browser fixtures
        run: python backend/tools/quiz_simulator.py
      - name: CLI course browser regression
        shell: pwsh
        run: |
          if ('${{ matrix.browser }}' -eq 'chrome') {
            $labBrowser = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          } else {
            $labBrowser = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          }
          if (-not (Test-Path -LiteralPath $labBrowser)) { throw "Browser unavailable: $labBrowser" }
          python backend/tools/course_lab.py --browser $labBrowser --repeat 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tools/capture_smoke.py --browser $labBrowser
      - name: Preserve synthetic reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-lab-${{ matrix.browser }}
          path: .course-lab/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
